
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Contato - Portal de Serviços Digitais</title>
</head>

<body>

    <header>
        <h1>Portal de Serviços Digitais</h1>
        <p>Entre em contato conosco.</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section>
            <h2>Entre em contato</h2>

            <p>
                Preencha os campos abaixo para enviar
                sua dúvida ou solicitação.
            </p>

            <form id="formContato">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione</option>
                    <option value="duvida">Dúvida</option>
                    <option value="solicitacao">Solicitação</option>
                    <option value="sugestao">Sugestão</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    required></textarea>

                <button type="submit">Enviar</button>

                <p id="mensagemForm" aria-live="polite"></p>

            </form>
        </section>

        <section class="preferencia">
            <h2>Meu serviço favorito</h2>

            <p>Escolha um serviço para guardar sua preferência.</p>

            <label for="servicoFavorito">Escolha:</label>
            <select id="servicoFavorito">
                <option value="">Selecione...</option>
                <option value="endereco">Endereço</option>
                <option value="atendimento">Atendimento</option>
                <option value="documentos">Documentos</option>
            </select>

            <button id="btnSalvarFavorito" type="button">
                Salvar favorito
            </button>

            <p id="favoritoSalvo" aria-live="polite"></p>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>

</body>
</html>
